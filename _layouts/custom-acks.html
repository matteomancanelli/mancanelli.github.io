{{ content }}

{% assign acks = site.acks | sort: "year" | reverse %}
<h2>Acknowledgments</h2>
{% for elem in acks %}
<div class="ackitem">
    <div class="ackname"><strong>{{ elem.name }}</strong></div>
    <div class="ackinfo">{{ elem.info }} &#xB7; {{ elem.year }}</div>
    <!-- <div class="ackyear">{{ elem.year }}</div> -->
</div>
{% endfor %}
